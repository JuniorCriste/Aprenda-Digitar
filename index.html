<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprenda Digitar - Profissional</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <nav class="top-bar">
        <div class="logo">Aprenda<span>Digitar</span></div>
        <div id="level-name" class="level-indicator">Carregando...</div>
        <div class="stats-top">
            <span>Erros: <strong id="mistake-count">0</strong></span>
            <span>WPM: <strong id="wpm-display">0</strong></span>
        </div>
    </nav>

    <main class="trainer-box">
        <div class="progress-container"><div id="progress-bar"></div></div>
        <div id="word-display" class="word-display"></div>
        <input type="text" id="hidden-input" autocomplete="off" autofocus>
    </main>

<center>Junior Criste - Informaticode 2026</center>
</div>

<script src="script.js"></script>
</body>
</html>
