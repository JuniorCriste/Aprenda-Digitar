<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Pro - Treinamento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">
    <nav class="top-bar">
        <div class="logo">Typing<span>Pro</span></div>
        <div class="nav-icons">
            <button title="Teclado">⌨️</button>
            <button title="Som">🔊</button>
            <button title="Configurações">⚙️</button>
        </div>
    </nav>

    <main class="trainer-box">
        <div class="level-info">
            <span id="level-name">Modo Carreira</span>
            <div class="progress-wrapper">
                <div id="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <div id="word-display" class="word-display"></div>

        <input type="text" id="hidden-input" autofocus>
        
        <div class="keyboard-hint">
            <p>Pressione a tecla correspondente para avançar</p>
        </div>
    </main>

    <div class="stats-panel">
        <div class="stat">Precisão: <span id="accuracy">100%</span></div>
        <div class="stat">WPM: <span id="wpm">0</span></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
